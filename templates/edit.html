<!DOCTYPE html>
<html>
<head>
    <title>Edit Note - Smart Notes Organizer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>✏️ Edit Note</h1>

    <form action="/update/{{ note[0] }}" method="POST">

        <label>Title</label>

        <input
            type="text"
            name="title"
            value="{{ note[1] }}"
            required
        >

        <label>Note</label>

        <textarea
            name="content"
            required
        >{{ note[2] }}</textarea>

        <label>Category</label>

        <select name="category">

            <option value="Study"
                {% if note[3] == "Study" %}selected{% endif %}>
                Study
            </option>

            <option value="Programming"
                {% if note[3] == "Programming" %}selected{% endif %}>
                Programming
            </option>

            <option value="Personal"
                {% if note[3] == "Personal" %}selected{% endif %}>
                Personal
            </option>

            <option value="Ideas"
                {% if note[3] == "Ideas" %}selected{% endif %}>
                Ideas
            </option>

        </select>

        <button type="submit">💾 Update Note</button>

        <a class="back" href="/">← Back</a>

    </form>

</div>

</body>
</html>
