<!DOCTYPE html>
<html>
<head>
    <title>Edit Note</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>✏️ Edit Note</h1>

    <div class="card">

        <form action="/edit/{{ note[0] }}" method="POST">

            <input
                type="text"
                name="title"
                value="{{ note[1] }}"
                required
            >

            <textarea
                name="content"
                required
            >{{ note[2] }}</textarea>

            <button type="submit">💾 Update Note</button>

        </form>

    </div>

</div>

</body>
</html>
